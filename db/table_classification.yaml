# NsureGRC table classification manifest (D-P0-009 s5). One entry per table, version-controlled.
# CI (tests/test_table_classification.py) compares this file with pg_catalog: every table must be listed and vice-versa,
# and the table's physical shape must match its class. An unclassified table fails the build.
#
# class: CAT | PLT | IDN | TEN | AUD | SYS      data_class: P | I | C | R (D-P0-007)
# rls: required | none      tenant_column: the ONLY permitted column that refers to a tenant (TEN: tenant_id)
version: 1
tables:
  # ------------------------------------------------------------------ SYS (framework bookkeeping, no business data)
  - {table: django_migrations, class: SYS, data_class: I, domain: platform, owner_module: django, rls: none,
     notes: "Schema migration history; owner-only (no runtime role has any privilege)."}

  # ------------------------------------------------------------------ PLT (platform control plane; ngrc_ops)
  - {table: plt_tenant, class: PLT, data_class: I, domain: tenancy, owner_module: ngrc.control_plane, rls: required,
     notes: "Tenant registry. Tenant plane sees only its own row (policy id = ngrc_current_tenant())."}
  - {table: plt_operator_account, class: PLT, data_class: R, domain: iam, owner_module: ngrc.control_plane, rls: none,
     notes: "Staff accounts + credential hashes. Reachable by ngrc_ops only."}
  - {table: plt_operator_role, class: PLT, data_class: I, domain: iam, owner_module: ngrc.control_plane, rls: none}
  - {table: plt_operator_session, class: PLT, data_class: R, domain: iam, owner_module: ngrc.control_plane, rls: none,
     notes: "Session token hashes."}
  - {table: plt_operator_throttle, class: PLT, data_class: R, domain: iam, owner_module: ngrc.control_plane, rls: none}
  - {table: plt_operator_webauthn_credential, class: PLT, data_class: R, domain: iam, owner_module: ngrc.control_plane, rls: none}
  - {table: plt_support_access_grant, class: PLT, data_class: C, domain: support, owner_module: ngrc.control_plane, rls: none,
     tenant_column: subject_tenant_id,
     notes: "State machine + separation of duties enforced by trigger; no DELETE/TRUNCATE; consent only via SECURITY DEFINER fns."}

  # ------------------------------------------------------------------ IDN (customer identity; ngrc_auth)
  - {table: idn_account, class: IDN, data_class: R, domain: iam, owner_module: ngrc.iam, rls: required,
     notes: "Credentials. ngrc_app has a column-level SELECT on (id,email,display_name,status) filtered by RLS (profile projection)."}
  - {table: idn_session, class: IDN, data_class: R, domain: iam, owner_module: ngrc.iam, rls: none,
     tenant_column: active_tenant_id}
  - {table: idn_totp_factor, class: IDN, data_class: R, domain: iam, owner_module: ngrc.iam, rls: none}
  - {table: idn_webauthn_credential, class: IDN, data_class: R, domain: iam, owner_module: ngrc.iam, rls: none}
  - {table: idn_recovery_code, class: IDN, data_class: R, domain: iam, owner_module: ngrc.iam, rls: none}
  - {table: idn_auth_token, class: IDN, data_class: R, domain: iam, owner_module: ngrc.iam, rls: none}
  - {table: idn_throttle, class: IDN, data_class: R, domain: iam, owner_module: ngrc.iam, rls: none}
  - {table: idn_invitation, class: IDN, data_class: R, domain: iam, owner_module: ngrc.iam, rls: none,
     tenant_column: subject_tenant_id,
     notes: "Deviation A10 from D-P0-009 s6: IDN-class (token hash is Restricted). Tenant admins use SECURITY DEFINER fns only."}

  - {table: idn_recovery_request, class: IDN, data_class: R, domain: iam, owner_module: ngrc.iam, rls: none,
     tenant_column: subject_tenant_id,
     notes: "Lost-factor recovery (F-ATH-015). No runtime role can write it: SECURITY DEFINER functions + a state-machine trigger. Cancel token stored as a hash."}

  # ------------------------------------------------------------------ TEN (tenant-owned; ngrc_app under RLS)
  - {table: ten_role, class: TEN, data_class: C, domain: iam, owner_module: ngrc.tenancy, rls: required, tenant_column: tenant_id}
  - {table: ten_membership, class: TEN, data_class: C, domain: iam, owner_module: ngrc.tenancy, rls: required, tenant_column: tenant_id}

  - {table: ten_evidence, class: TEN, data_class: R, domain: evidence, owner_module: ngrc.evidence, rls: required, tenant_column: tenant_id,
     notes: "Evidence records; row-level data_class C|R (Restricted needs a privileged permission). Searchable via a generated tsvector under RLS."}
  - {table: ten_evidence_revision, class: TEN, data_class: R, domain: evidence, owner_module: ngrc.evidence, rls: required, tenant_column: tenant_id,
     notes: "Immutable file revisions (hash, size, scan state). No DELETE for any runtime role; scan outcome recordable once."}

  - {table: ten_framework_activation, class: TEN, data_class: C, domain: framework, owner_module: ngrc.framework, rls: required, tenant_column: tenant_id,
     notes: "D-P2-001: tenant's pinned framework version. Stores framework_urn/pinned_version_label (stable keys), not an FK into cat_*."}
  - {table: ten_mapping_override, class: TEN, data_class: C, domain: framework, owner_module: ngrc.framework, rls: required, tenant_column: tenant_id,
     notes: "D-P2-001: tenant mapping override, never touched by catalogue publishes. Stable-key reference, not an FK into cat_*."}
  - {table: ten_framework_changeset_decision, class: TEN, data_class: C, domain: framework, owner_module: ngrc.framework, rls: required, tenant_column: tenant_id,
     notes: "D-P2-001: append-only migration decision (migrate|stay|reject) against a plt_framework_change_set, referenced by plain UUID (no FK, PLT class)."}
  - {table: ten_framework_custom, class: TEN, data_class: C, domain: framework, owner_module: ngrc.framework, rls: required, tenant_column: tenant_id,
     notes: "D-P2-003: tenant-authored custom framework, parallel in shape to cat_framework."}
  - {table: ten_framework_custom_version, class: TEN, data_class: C, domain: framework, owner_module: ngrc.framework, rls: required, tenant_column: tenant_id,
     notes: "D-P2-003: immutable once published (trigger-enforced), same rule as cat_framework_version."}
  - {table: ten_framework_custom_requirement, class: TEN, data_class: C, domain: framework, owner_module: ngrc.framework, rls: required, tenant_column: tenant_id,
     notes: "D-P2-003: immutable once its version is published (trigger checks the parent version's status)."}

  - {table: ten_common_control, class: TEN, data_class: C, domain: control, owner_module: ngrc.controls, rls: required, tenant_column: tenant_id,
     notes: "D-P3-001: reusable control intent/objective."}
  - {table: ten_implementation_control, class: TEN, data_class: C, domain: control, owner_module: ngrc.controls, rls: required, tenant_column: tenant_id,
     notes: "D-P3-001: concrete implementation of a CommonControl."}
  - {table: ten_control_assertion, class: TEN, data_class: C, domain: control, owner_module: ngrc.controls, rls: required, tenant_column: tenant_id,
     notes: "D-P3-001: links an ImplementationControl to a framework requirement by stable (framework_urn, requirement_urn) keys, not an FK into cat_requirement/ten_framework_custom_requirement. satisfaction_state is stored, not yet derived (no EvidenceLink/Test linkage this increment)."}
  - {table: ten_evidence_requirement, class: TEN, data_class: C, domain: control, owner_module: ngrc.controls, rls: required, tenant_column: tenant_id,
     notes: "D-P3-002: standing evidence expectation attached to an ImplementationControl. No requested/collected/... lifecycle of its own - fulfilment is a read-model question over EvidenceLink rows."}
  - {table: ten_evidence_link, class: TEN, data_class: C, domain: control, owner_module: ngrc.controls, rls: required, tenant_column: tenant_id,
     notes: "D-P3-002: governed link from a pinned, already-collected EvidenceRevision to a ControlAssertion. evidence_revision_id carries a same-tenant composite FK into ten_evidence_revision (raw SQL, same pattern as ten_evidence_revision -> ten_evidence)."}
  - {table: ten_test, class: TEN, data_class: C, domain: control, owner_module: ngrc.controls, rls: required, tenant_column: tenant_id,
     notes: "D-P3-003: standing test procedure attached to an ImplementationControl (sibling of EvidenceRequirement, not nested under ControlAssertion)."}
  - {table: ten_test_result, class: TEN, data_class: C, domain: control, owner_module: ngrc.controls, rls: required, tenant_column: tenant_id,
     notes: "D-P3-003: one test execution's outcome. scheduled -> running -> passed/failed/unknown -> remediating -> verified; only failed continues into remediation."}
  - {table: ten_control_plan, class: TEN, data_class: C, domain: control, owner_module: ngrc.controls, rls: required, tenant_column: tenant_id,
     notes: "D-P3-005: named grouping of tasks under a broader initiative. Deliberately thin (label, owner, target date)."}
  - {table: ten_task, class: TEN, data_class: C, domain: control, owner_module: ngrc.controls, rls: required, tenant_column: tenant_id,
     notes: "D-P3-005: assignable, due-dated unit of work against an ImplementationControl. Not an input to satisfaction_state (07_CONTROL_EVIDENCE.md: supporting operations must not create duplicate control/evidence state)."}
  - {table: ten_finding, class: TEN, data_class: C, domain: control, owner_module: ngrc.controls, rls: required, tenant_column: tenant_id,
     notes: "D-P4-001: mutable, verified-close lifecycle record of a control gap. Remediation is this model's own in_remediation state + notes field, not a separate model."}
  - {table: ten_security_exception, class: TEN, data_class: C, domain: control, owner_module: ngrc.controls, rls: required, tenant_column: tenant_id,
     notes: "D-P4-001: append-only governed waiver (07_CONTROL_EVIDENCE.md's Exceptions section). No UPDATE grant to ngrc_app at all - every field is fixed at creation; DB trigger rejects UPDATE/DELETE/TRUNCATE outright, same pattern as ten_evidence_revision."}

  - {table: ten_risk_assessment, class: TEN, data_class: C, domain: risk, owner_module: ngrc.risk, rls: required, tenant_column: tenant_id,
     notes: "D-P4-002: a named risk-assessment exercise (e.g. '2027 Annual')."}
  - {table: ten_risk_scenario, class: TEN, data_class: C, domain: risk, owner_module: ngrc.risk, rls: required, tenant_column: tenant_id,
     notes: "D-P4-002: threat/vulnerability pairing scored 1-5 likelihood/impact (ISO 27005). risk_level is derived (ngrc.risk.services.risk_level), never stored."}
  - {table: ten_risk_acceptance, class: TEN, data_class: C, domain: risk, owner_module: ngrc.risk, rls: required, tenant_column: tenant_id,
     notes: "D-P4-002: append-only governed acceptance of residual risk, same pattern as ten_security_exception. No UPDATE grant to ngrc_app; DB trigger rejects UPDATE/DELETE/TRUNCATE outright."}
  - {table: ten_incident, class: TEN, data_class: C, domain: risk, owner_module: ngrc.risk, rls: required, tenant_column: tenant_id,
     notes: "D-P4-003: detect-through-close lifecycle (NIST SP 800-61 stages). Optional links to a RiskScenario and/or ImplementationControl, neither required at creation."}

  # ------------------------------------------------------------------ CAT (global catalogue; ngrc_catalog_publisher writes, ngrc_app reads)
  - {table: cat_framework, class: CAT, data_class: I, domain: framework, owner_module: ngrc.framework, rls: none}
  - {table: cat_framework_version, class: CAT, data_class: I, domain: framework, owner_module: ngrc.framework, rls: none,
     notes: "Immutable once published_at is set (trigger-enforced); requirement snapshot per version."}
  - {table: cat_requirement, class: CAT, data_class: I, domain: framework, owner_module: ngrc.framework, rls: none,
     notes: "Immutable once its framework_version is published (trigger checks the parent version's status)."}
  - {table: cat_mapping, class: CAT, data_class: I, domain: framework, owner_module: ngrc.framework, rls: none,
     notes: "Immutable once locked=true (one-way; trigger-enforced)."}

  # ------------------------------------------------------------------ PLT (curator/operator plane; ngrc_catalog_publisher writes, ngrc_app reads)
  - {table: plt_framework_change_set, class: PLT, data_class: I, domain: framework, owner_module: ngrc.framework, rls: none,
     notes: "Append-only from creation (trigger-enforced): persists every framework version transition's diff."}
  - {table: plt_framework_source_registry, class: PLT, data_class: I, domain: framework, owner_module: ngrc.framework, rls: none,
     notes: "Metadata-only stub (D-P2-001): no live fetcher reads or writes this in this increment."}

  # ------------------------------------------------------------------ AUD (audit schema; append functions only)
  - {table: audit.action_registry, class: AUD, data_class: I, domain: audit, owner_module: ngrc.audit, rls: none}
  - {table: audit.chain_head, class: AUD, data_class: R, domain: audit, owner_module: ngrc.audit, rls: none}
  - {table: audit.checkpoint, class: AUD, data_class: R, domain: audit, owner_module: ngrc.audit, rls: required}
  - {table: audit.verification_run, class: AUD, data_class: R, domain: audit, owner_module: ngrc.audit, rls: none}
  - {table: audit.platform_event, class: AUD, data_class: R, domain: audit, owner_module: ngrc.audit, rls: required,
     tenant_column: related_tenant_id, notes: "related_tenant_id is nullable BY DOCUMENTED DESIGN (platform stream)."}
  - {table: audit.tenant_event, class: AUD, data_class: C, domain: audit, owner_module: ngrc.audit, rls: required,
     tenant_column: tenant_id}
