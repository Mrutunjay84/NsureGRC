[project]
name = "nsuregrc"
version = "1.3.0a1"
description = "NsureGRC - secure GRC platform (v1.3-alpha, Phase 1 secure foundation)"
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "Django>=5.2.18,<5.3",          # 5.2 LTS (D-P0-002); migrate to 6.2 LTS when released (tracked: docs/DEPENDENCIES.md)
    "djangorestframework>=3.16,<4",
    "psycopg[binary]>=3.2,<4",
    "argon2-cffi>=23.1",
    "cryptography>=44",
    "pyotp>=2.9,<3",
    "webauthn>=2.5,<3",
    "gunicorn>=23",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
    "bandit>=1.8",
    "pip-audit>=2.9",
    "semgrep>=1.100",
    "detect-secrets>=1.5",
    "cbor2>=5.6",                    # test-only virtual WebAuthn authenticator
    "pyyaml>=6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "security: security-control regression test",
    "blocked: test cannot run until infrastructure/feature exists (see BLOCKED_TESTS.md)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "I"]
ignore = [
    "S101",   # assert is fine in tests; production code uses explicit raises (bandit B101 is enforced separately)
    "E501",   # line length is a formatting preference here, not a security control (lines are kept readable by review)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S603", "S608", "B017", "PT011", "E402"]  # fixtures use fake credentials; subprocess runs sys.executable only

[tool.bandit]
# Migrations are reviewed, static SQL executed only by the migration identity (ngrc_owner) at deploy time. Their B608 hits are
# f-strings that interpolate module-level CONSTANTS (search_path clause, signature lists) - triaged as false positives in
# docs/SECURITY_SCAN_REPORT.md. Compensating controls: Semgrep + ruff S608 still scan them, and
# tests/test_input_and_exposure.py::test_no_string_built_sql_outside_the_reviewed_set guards runtime code.
exclude_dirs = ["tests", ".venv", "ngrc/audit/migrations", "ngrc/control_plane/migrations", "ngrc/iam/migrations", "ngrc/tenancy/migrations", "ngrc/core/migrations"]
