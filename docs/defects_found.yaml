# Defects found while verifying the Phase 1 implementation (by the test suite, scanners or review) and what was done about them.
# Severity is the engineer's assessment, not a CVSS score. Every fixed item names the regression test that now guards it.
# `status: fixed` means a fix exists AND the named tests pass in the recorded run; it is not a claim that no similar defect remains.
version: 1
defects:
  - id: DEF-01
    title: Application could not start - circular import between DRF settings and ngrc.authz.drf
    severity: high (availability; blocked every other control)
    found_by: django system check (first run)
    detail: REST_FRAMEWORK referenced classes inside the module that imports rest_framework.views, which resolves those paths while it is still being imported.
    fix: classes moved to ngrc/authz/drf_defaults.py (no rest_framework.views import); drf.py re-exports them.
    tests: [tests/test_authorization_api.py::test_drf_defaults_fail_closed, tests/test_smoke_flows.py]
    status: fixed
  - id: DEF-02
    title: Tenant provisioning always failed - plt_provision_tenant omitted the NOT NULL column idn_invitation.kind
    severity: high (functional; no tenant could be created)
    found_by: tests/test_rls_tenant_isolation.py fixtures
    fix: migration control_plane/0003_provision_invitation_kind.py (CREATE OR REPLACE FUNCTION)
    tests: [tests/test_support_access.py::test_only_platform_admin_can_provision_and_it_needs_step_up, tests/test_rls_tenant_isolation.py]
    status: fixed
  - id: DEF-03
    title: The migration identity (ngrc_owner) inherited the audit owner's privileges and could forge audit rows
    severity: high (audit integrity; contradicts D-P0-006 duty separation)
    found_by: manual probe while writing the audit tamper tests
    detail: GRANT ngrc_audit_owner TO ngrc_owner defaulted to INHERIT TRUE, so ngrc_owner could INSERT into audit.chain_head and call the hash helper without SET ROLE.
    fix: GRANT ... WITH INHERIT FALSE, SET TRUE in db/bootstrap/00_roles.sql; audit migration 0001 now executes SET LOCAL ROLE before touching audit-owned objects.
    tests: [tests/test_audit_integrity.py::test_migration_identity_cannot_write_audit_without_set_role, tests/test_table_classification.py::test_migration_identity_has_no_privileges_on_audit]
    status: fixed
    note: Existing clusters must re-run the GRANT (documented in docs/OPERATIONS_NOTES.md). A database SUPERUSER remains outside this control (see F-AUD-001 gaps).
