  - id: DEF-14
    title: Support-grant guard trigger weaknesses - platform_admin accepted as requester (H-01); decision/time columns editable without a state change (an ACTIVE grant's expiry could be extended, approvers planted, activation/approval times rewritten); consent columns writable on any transition by the owner role; pre-set decision fields accepted on insert; role-only (not account-status) checks
    severity: high (the audit stream accepts operator `support.action` events while a grant is active and `expires_at > now()`, so an extended expiry widened the window in which operator actions were accepted; also weakened separation of duties at the database layer)
    found_by: P2-4 re-review of plt_support_grant_guard (H-01 plus the same-state branch)
    detail: Only reachable by a holder of the ngrc_ops credential (or SQL injection into the operator plane); the application layer did not expose it. The Phase 1 tests exercised illegal STATE TRANSITIONS, not same-state column edits.
    fix: migration control_plane/0004_harden_support_grant_guard.py - requester must hold platform_support and be active; decision/time columns are write-once and set only with the matching transition; expiry can only be SHORTENED while active; the single remaining same-state write is the fully validated first break-glass approval; consent columns change only on approved -> tenant_consented; insert rejects pre-set fields and inconsistent scope; approvers/requester must be active accounts and the requester must still hold platform_support at activation.
    tests: [tests/test_support_grant_db_guard.py::test_only_platform_support_can_be_the_requester_even_by_direct_insert, tests/test_support_grant_db_guard.py::test_an_active_grant_cannot_be_widened_or_rewritten_without_a_state_transition, tests/test_support_grant_db_guard.py::test_expiry_may_be_cut_short_but_never_extended_and_audit_follows_the_real_expiry, tests/test_support_grant_db_guard.py::test_break_glass_first_approval_is_validated_in_full, tests/test_support_grant_db_guard.py::test_activation_requires_the_requester_to_still_hold_platform_support]
    status: fixed
    note: 25 of the 26 new tests fail against the Phase 1 trigger (evidence/p2_4_mutation_check_phase1_trigger.txt); the 26th guards a rule that already existed.
  - id: DEF-15
    title: "Failure-triggered lock-out was exploitable by a stranger: repeated failed logins (20; operators 10) or second-factor failures (10) set the account to recovery_required, and the ADR's dedicated unlock flow and owner/admin notification did not exist"
    severity: "medium-high (availability: repeatable lock-out denial of service; operator accounts had no self-service exit). First recorded as 'high, no exit path' - CORRECTED: customer accounts could leave the state via password reset"
    found_by: "preparing the P2-2 review package (reading throttle.py against the ADR); corrected while building F-ATH-015"
    detail: "The progressive back-off alone would not lock an account; the hard stop did. Customer exit existed (password-reset confirmation sets status back to active, revokes sessions, MFA still required; proven by test) but forced a disruptive password change on anyone a stranger chose, produced no owner/admin notification, and operator accounts (no e-mail reset) had no self-service exit. The old test asserted the lock (intended ADR behaviour) but nothing asserted the exit."
    fix: "TEMPORARY, by project-owner decision 2026-10-21 (ADR 00_CONTROL/PHASE1/D-P1-001): the automatic transition to recovery_required was removed for the customer and operator realms and for second-factor failures; replaced by counted, progressive, pre-hash delays, per-IP limiting, audit events, suspicious-login detection (many sources against one account; success after a failure burst) with alerts (log sink only; delivery is open item O-4), and STRICTER operator parameters (free 3, 120 s doubling to 3600 s). Found and fixed on the way: a malformed client address made the audit append fail (HTTP 500) - addresses are now normalised (ngrc/core/net.py)."
    tests: [tests/test_auth_backoff_policy.py::test_no_number_of_failures_ever_locks_the_account, tests/test_auth_backoff_policy.py::test_delays_grow_progressively_to_the_cap_and_are_enforced_before_the_password_check, tests/test_auth_backoff_policy.py::test_attempts_from_several_sources_against_one_account_raise_one_alert, tests/test_auth_backoff_policy.py::test_operator_accounts_are_throttled_harder_and_alert_at_critical_severity, tests/test_auth_backoff_policy.py::test_hostile_source_addresses_cannot_break_the_counters, tests/test_auth_backoff_policy.py::test_a_recovery_required_account_still_has_an_exit_through_password_reset_with_mailbox_proof]
    status: mitigated-temporary
    note: "NOT closed. Residual risks are written into D-P1-001 (an attacker can keep a victim waiting up to the delay cap; no cross-account distributed-attack detection; alert delivery missing). Closes only when the permanent recovery mechanism F-ATH-015 is implemented, tested and reviewed. **Re-confirmed by owner instruction, 2026-10-27**: owner extended standing delegation (\"no one on this team to approve... where there is human need to evolve, take the discussion yourself\") to cover this re-confirmation - residual risks above are unchanged by the correction (it only narrowed customer-account severity; operator accounts and the stranger-triggered-reset/no-notification gaps stand as originally assessed), so the mitigated-temporary status and its exit condition (F-ATH-015) stand. This re-confirmation is a risk-acceptance judgment call the owner can delegate; it is NOT the same kind of decision as P2-2's independent review, which cannot be delegated to the implementer by definition - see docs/PHASE1_SECURITY_GATE.md's P2-2 row, left unchanged."
  - id: DEF-16
    title: DevFileSigner key-creation race - two processes (sealer and verifier/scheduler) using the dev signer for the first time concurrently could each create a different key file, one signing with a key the other then overwrote or failed to load
    severity: low (DEV-ONLY signer; would produce spurious verification failures, not a bypass)
    found_by: writing the concurrent-sealer test for H-11 (tests/test_audit_completeness.py)
    fix: ngrc/audit/signer.py creates the key file exclusively and, on FileExistsError, loads the key that won the race.
    tests: [tests/test_audit_completeness.py::test_concurrent_sealers_publish_each_checkpoint_exactly_once]
    status: fixed
  - id: DEF-17
    title: Malformed REMOTE_ADDR / X-forwarded values reached the audit append as an ip column value and raised DataError, turning a login attempt into HTTP 500
    severity: low-medium (availability / error handling on an unauthenticated path)
    found_by: writing tests/test_auth_backoff_policy.py
    fix: ngrc/core/net.py normalize_ip(); unparseable values share one throttle bucket ('unknown') and are stored as NULL.
    tests: [tests/test_auth_backoff_policy.py::test_hostile_source_addresses_cannot_break_the_counters]
    status: fixed
    note: residual - one shared bucket can be filled by an attacker controlling REMOTE_ADDR; production gets the address from a trusted proxy configuration that does not yet exist (review concern 23).
  - id: DEF-18
    title: "seal_all() read the previous cp_index and inserted the next one as two unlocked, uncoordinated statements; concurrent sealers for the same stream could each read a stale 'previous' state and both insert successfully at DIFFERENT, non-colliding indices (1 then 2) instead of exactly one winning and the rest exporting nothing"
    severity: "low-medium (no chain forgery, no silent gap, no data loss: each inserted checkpoint is still individually valid and the continuity trigger still enforces gapless, correctly-chained indices at the moment each INSERT runs - the trigger re-reads 'previous' fresh under READ COMMITTED, so the second insert correctly chains from the first. The defect is redundant-but-valid checkpoints when sealer invocations overlap - e.g. an overlapping retry or a double-triggered scheduler run - which is a waste/operational-hygiene issue, not a forgery or completeness gap)"
    found_by: "the first real CI run on GitHub Actions hardware (run 40227089460, 2026-10-25) - not reproducible on this Windows development workstation; different CPU/scheduling exposed a timing window the local environment never hit"
    detail: "_previous() reads the current max cp_index with a plain SELECT, outside any lock; seal_all() then computes idx+1 and INSERTs. Under ATOMIC_REQUESTS=False with no explicit transaction, each statement auto-commits individually, so there was no atomicity between the read and the write at all. The checkpoint_v2_index unique index and the checkpoint_continuity trigger (0004_checkpoint_continuity.py) both re-check at INSERT time and would reject two inserts claiming the SAME cp_index - but they do nothing to stop two concurrent sealers from each being handed a DIFFERENT, individually-valid next index when one commits in between the other's read and its own insert. test_concurrent_sealers_publish_each_checkpoint_exactly_once (4 threads, barrier-synchronised) caught exactly this: two checkpoints (cp_index 1 and 2) were both published for one seal attempt instead of one winner."
    fix: "ngrc/audit/sealer.py - each stream's read-decide-insert step now runs inside transaction.atomic(using=DB), holding a transaction-scoped PostgreSQL advisory lock (pg_advisory_xact_lock(hashtext(stream_key))) for the whole step. A second sealer for the same stream now blocks on the lock until the first commits, then re-reads the now-current chain_head/checkpoint state and correctly finds nothing new to seal. The INSERT itself is wrapped in a nested atomic() savepoint so the pre-existing IntegrityError/ProgrammingError fallback still works if something unexpected still collides. No migration or grant change: pg_advisory_xact_lock needs no table privilege, only the existing SELECT grant ngrc_audit_sealer already has on chain_head/checkpoint."
    tests: [tests/test_audit_completeness.py::test_concurrent_sealers_publish_each_checkpoint_exactly_once]
    status: fixed
    note: "fix verified against the real CI run that found it, not reproduced locally - this Windows workstation's threading did not expose the race either before or after the fix, so the only trustworthy verification environment for this defect is GitHub Actions' PostgreSQL service container."
  - id: DEF-19
    title: ".gitleaks.toml's path allowlist used the top-level key `[[allowlists]]` (plural, array-of-tables), which is only valid NESTED under a specific `[[rules]]` block; at the top level it is not a recognised gitleaks key. A TOML decoder accepts an unknown table silently, so the file parsed without error and gitleaks simply never applied it - every one of the four allow-listed paths (.venv/, .secrets.baseline, its scan output, the audit-chain verification evidence) was unprotected from the day this file was written"
    severity: "low (process/tooling gap, not an application vulnerability: the four paths were allow-listed precisely because manual review already judged their contents not to be secrets - SHA-1 digests, a public Ed25519 signature, third-party package files. No real secret was exposed; the practical effect was that the secret-scanning gate would reject commits over content already known to be safe)"
    found_by: "the first real gitleaks run on GitHub Actions (part of run 40228269549's secret-scanning job, 2026-10-25), triggered by .secrets.baseline's content being long enough to actually hit the generic-api-key rule; reproduced and root-caused with a local gitleaks 8.24.3 binary (same version gitleaks-action@v2 installs) run directly against this repository, since the project's earlier local-rehearsal claim of '0 findings' (SECURITY_SCAN_REPORT.md) had never actually exercised this allowlist against content that would trigger a finding"
    detail: "gitleaks' documented global allowlist table is singular `[allowlist]` (README 'Additional Configuration'); `[[allowlists]]` (plural) is documented only as a nested, repeatable block under `[[rules]]`, for per-rule allowlisting. Verified empirically: a minimal reproduction config using `[[allowlists]]` at the top level left `.secrets.baseline`'s findings unsuppressed even with a deliberately relaxed, unanchored path regex; the identical `paths` value under `[allowlist]` (singular) immediately produced the expected 'Skipping file due to global allowlist' debug line and zero findings."
    fix: ".gitleaks.toml - the three separate `[[allowlists]]` blocks merged into one `[allowlist]` table with a combined `paths` list (one table is all TOML's duplicate-key rule permits; a second `[allowlist]` table would silently replace the first, not merge with it - documented inline so this is not repeated). Verified against a local gitleaks 8.24.3 binary: a working-tree scan and a full 13-commit history scan (the exact flags the CI job uses) both report 'no leaks found', exit 0."
    tests: ["manual verification only - gitleaks is a third-party binary, not something this project's own pytest suite invokes; verified via run 40228269549 (TOOL job: secret scanning) turning from failure to the fixed config's local reproduction, and will be confirmed green on the next real CI run"]
    status: fixed
    note: "no evidence any real secret was ever actually exposed by this gap - the four allow-listed paths hold digests/public-key material by design, not secrets. Recorded because 'the allowlist works' was an unverified assumption the project had carried since Phase 1, and this is exactly the kind of silent gap the project's own rule (never claim a control passed without a real run proving it) exists to catch."
  - id: DEF-20
    title: "scripts/import_ci_run.py's _get() forwarded the GitHub Authorization header across the 302 redirect GitHub's artifact-download endpoint issues (to a signed Azure Blob Storage URL), which Azure rejected with HTTP 401 - the conflicting Authorization header defeats its own SAS-token query-string auth"
    severity: "low (tooling, not application code; blocks recording a real CI run but has no security consequence - the token stays the caller's own read-only token the whole time, never leaked to a wrong party, just rejected by Azure)"
    found_by: "the first real invocation of import_ci_run.py against the real GitHub API (2026-10-26), exactly the gap the script's own docstring already named: 'the HTTP calls have NOT been exercised against the real API because no repository or credentials exist yet'"
    detail: "Python's urllib.request follows HTTP redirects by default and, by default, forwards the original request's headers - including a custom Authorization header - to the redirect target, even when that target is a different host entirely. GitHub's artifact-download API (/actions/artifacts/{id}/zip) always 302s to Azure Blob Storage; Azure's SAS-token URL already carries its own authorization in the query string and rejects a request that also carries an unexpected Authorization header."
    fix: "scripts/import_ci_run.py - a custom urllib.request.HTTPRedirectHandler (_StripAuthOnRedirect) strips the Authorization header whenever the redirect target's host differs from the original request's host, used via a dedicated opener for all requests this script makes. Verified against the real API: downloaded and parsed the test-evidence, sast-evidence, container-evidence and sca-evidence artifacts from run 40232416860 without error, producing docs/ci/CI_RUN_RECORD.yaml with 615 tests_passed / 0 tests_failed / 63 rls_tests_passed read directly from the real JUnit artifact."
    tests: ["manual verification only - this script makes real HTTP calls to a third-party API (GitHub, Azure Blob Storage) that the pytest suite does not and should not call; verified by actually running it against run 40232416860 and checking scripts/check_ci_record.py then printed PASSED"]
    status: fixed
    note: "the unit-tested pure functions (tests/test_ci_record.py) never exercised this path since they use fixture HTTP responses with no redirect - exactly the gap the script's own docstring disclosed in advance. Nothing here was invented: fields the importer still cannot derive (workflow_sha256, image_scan, history_scanned) were filled by hand from the run's own log, each with the specific evidence line, not guessed."
  - id: DEF-21
    title: "runtime image's base layer (python:3.12-slim-bookworm, debian 12.15) carried a HIGH-severity openssl/libssl3 vulnerability (CVE-2026-84782) newly published to Trivy's vulnerability DB - not present or not yet known at the time any earlier CI run or local scan of this Dockerfile was performed"
    severity: "high per Trivy/NVD severity rating; no evidence of exploitation against this project - caught by the Phase 3 D-P3-002 PR's routine container-scan CI job before merge, not by incident response"
    found_by: "aquasecurity/trivy-action's image scan on PR #12's CI run (run 40385690077, 2026-10-26), which downloads a fresh vulnerability DB on every run - this is exactly the kind of newly-disclosed base-image CVE that a point-in-time scan cannot have caught earlier and a later one will"
    detail: "Trivy reported CVE-2026-84782 (HIGH, fixed in 3.0.22-1~deb12u2) against both the openssl and libssl3 packages at their then-installed version 3.0.22-1~deb12u1, pulled in transitively by the python:3.12-slim-bookworm base image - not a dependency this project chose or pinned itself."
    fix: "Dockerfile - openssl and libssl3 added to the existing `apt-get install --only-upgrade` step (same mechanism already used for the tzdata/DLA-4854-1 patch), pinned to the fixed version 3.0.22-1~deb12u2 reported by Trivy. No application code change; this is a base-image/OS-package patch only."
    tests: ["CI job 'container build + image scan + Dockerfile lint' (aquasecurity/trivy-action, HIGH/CRITICAL with an available fix fail the build) - re-run on the next push to confirm 0 findings; the image has no container runtime on this Windows development workstation to verify the apt pin resolves before pushing (docs/BLOCKED_TESTS.md), same constraint already documented for every other Dockerfile change in this project"]
    status: fixed
    note: "base-image CVEs are an ongoing maintenance category, not a one-time defect: each new Trivy DB update can surface a newly-disclosed vulnerability in an unchanged Dockerfile, the same way DEF-18 surfaced only under real CI hardware timing. No claim is made that this exhausts base-image vulnerabilities going forward - only that this specific one, found on this PR's CI run, is fixed and tested by that same CI job."
