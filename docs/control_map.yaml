# Control -> implementation -> test -> audit event -> evidence map (Phase 1).
# This file is HAND-MAINTAINED INPUT. It contains NO results. `scripts/build_reports.py` joins it with the real pytest JUnit output
# (evidence/junit.xml) to generate docs/SECURITY_CONTROL_MATRIX.md, docs/SECURITY_TEST_REPORT.md and the traceability CSV, so a
# control can only read "TESTED (PASS)" if the named tests actually ran and passed in the last run.
#
# fields
#   tests:       list of {file, match?}; `match` = substrings of test function names (omit => every test in the file)
#   dev_only:    a dev/test stand-in is the only implementation (never a production control)
#   gaps:        known unimplemented/partial aspects of THIS control (shown in the status; never hidden)
#   blocked:     tests that cannot run until infrastructure exists (see docs/BLOCKED_TESTS.md)
#   not_implemented: true => no implementation exists in Phase 1
#   standards:   INDICATIVE mapping only. Not a statement that any standard requirement is met.
#   phase2_required: owner decision 2026-10-21 - must be implemented and tested before Phase 2 can be called security-ready
#   production_gate: owner decision 2026-10-21 - NOT a Phase 2 development blocker, but a gate before any production use
#   pending_specs: executable specifications reported as XFAIL (never a pass)
#   dynamic: status comes from a human/CI-supplied record (review | ci)
version: 1
controls:
  # ------------------------------------------------------------------------------------------------ tenancy / data isolation
  - id: F-TEN-001
    feature: Tenant isolation via PostgreSQL RLS
    requirement: Tenant-owned tables enforce the tenant policy in the database; runtime roles cannot bypass RLS
    source: D-P0-003
    implementation: [ngrc/core/sqlgen.py, ngrc/tenancy/migrations/0002_security.py, ngrc/control_plane/migrations/0002_security.py, db/bootstrap/00_roles.sql]
    tests:
      - {file: tests/test_rls_tenant_isolation.py}
      - {file: tests/test_table_classification.py, match: [test_ten_tables_shape, test_rls_flag_matches_manifest]}
      - {file: tests/test_rls_bypass_attempts.py}
    audit_events: [authz.denied]
    evidence: [evidence/junit.xml, evidence/rls_coverage.json, evidence/privilege_matrix.json]
    standards: "ISO 27001:2022 A.5.15, A.8.3; SOC 2 CC6.1; OWASP API1 BOLA"
  - id: F-TEN-002
    feature: Fail-closed transaction-scoped tenant context
    requirement: Missing/invalid tenant context yields no rows and no writes; context comes only from the authenticated session or a verified grant
    source: D-P0-003 s3
    implementation: [ngrc/core/context.py, ngrc/core/models.py, ngrc/authz/drf.py]
    tests:
      - {file: tests/test_rls_tenant_isolation.py, match: [context, no_context, malformed, orm_guard, invalid_tenant, leak]}
      - {file: tests/test_authorization_api.py, match: [no_tenant_selected, tampered_session_tenant, tenant_identifier_in_requests, removing_membership, suspended_tenant, expired_membership]}
    audit_events: [authz.denied]
    evidence: [evidence/junit.xml]
    standards: "ISO 27001:2022 A.8.3; SOC 2 CC6.1; OWASP API1"
    gaps: ["Connection-pooler (PgBouncer transaction mode) behaviour is BLOCKED: no pooler in the Phase 1 environment; the transaction-local set_config design is tested on a direct connection"]
    blocked: ["pooling test against a real transaction pooler"]
  - id: F-TEN-003
    feature: Composite tenant FKs and tenant-scoped uniques
    requirement: No cross-tenant references; no cross-tenant uniqueness oracle
    source: D-P0-003 s5
    implementation: [ngrc/tenancy/migrations/0002_security.py]
    tests:
      - {file: tests/test_rls_tenant_isolation.py, match: [composite_fk, unique_constraints, tenant_id_is_immutable]}
      - {file: tests/test_table_classification.py, match: [ten_unique_constraints, no_foreign_key_from_non_ten]}
    audit_events: []
    evidence: [evidence/junit.xml]
    standards: "ISO 27001:2022 A.8.3; OWASP API1"
  - id: F-TEN-004
    feature: Table classification manifest with automated enforcement
    requirement: Every table classified (CAT/PLT/IDN/TEN/AUD) and shape-checked against pg_catalog; privilege matrix exact
    source: D-P0-009 s5
    implementation: [db/table_classification.yaml, tests/test_table_classification.py]
    tests:
      - {file: tests/test_table_classification.py}
    audit_events: []
    evidence: [evidence/junit.xml, evidence/rls_coverage.json, evidence/privilege_matrix.json]
    standards: "ISO 27001:2022 A.5.9, A.5.12, A.5.15; SOC 2 CC6.1"
    gaps: ["No CAT-class tables exist yet (framework catalogue is Phase 2); the CAT shape rules are implemented but unexercised", "Enforced by pytest; the CI job that runs it has not been executed on a CI runner"]
  # ------------------------------------------------------------------------------------------------ authorization
  - id: F-AUZ-001
    feature: Central policy resolver and default-deny route registry
    requirement: Every route declares a policy; undeclared => denied; server-side resolver; public routes allow-listed with a reason
    source: D-P0-003 s1, 05_SECURITY
    implementation: [ngrc/authz/policy.py, ngrc/authz/drf.py, ngrc/authz/drf_defaults.py, ngrc/authz/permissions.py]
    tests:
      - {file: tests/test_authorization_api.py, match: [every_route, public_routes, every_non_public, view_without_policy, drf_defaults, endpoint_inventory, member_has_no_tenant_admin]}
    audit_events: [authz.denied]
    evidence: [evidence/junit.xml, evidence/route_policy_inventory.json]
    standards: "ISO 27001:2022 A.5.15, A.8.3; SOC 2 CC6.1, CC6.3; OWASP API5 BFLA; ASVS V4"
  - id: F-AUZ-002
    feature: BOLA/IDOR regression suite
    requirement: Another tenant's identifiers yield 404/403 with no data and no existence oracle, plus an audit trail
    source: D-P0-003 testing req. 4-5
    implementation: [ngrc/authz/drf.py, ngrc/tenancy/views.py, RLS policies]
    tests:
      - {file: tests/test_authorization_api.py, match: [idor, tenant_identifier_in_requests, audit_trail_and_export, selecting_a_tenant_without_membership]}
      - {file: tests/test_support_access.py, match: [another_tenants_owner]}
      - {file: tests/test_audit_integrity.py, match: [tenant_cannot_read_other_tenants_audit]}
    audit_events: [authz.denied]
    evidence: [evidence/junit.xml]
    standards: "OWASP API1 BOLA; ISO 27001:2022 A.8.3; SOC 2 CC6.1"
    gaps: ["Cross-tenant SEARCH (F-AUZ-005) and DOWNLOAD (F-DAT-004) are now tested; REPORT, EXPORT, NOTIFICATION and JOB tests remain BLOCKED: those features do not exist (test_endpoint_inventory_is_reviewed fails the build if such an endpoint appears without extending the suite)"]
    blocked: ["cross-tenant report/export/job/notification"]
  - id: F-AUZ-003
    feature: Privilege-escalation prevention in tenant role management
    requirement: No one can grant permissions they do not hold, modify themselves, outrank-modify, create platform rights, or alter system roles
    source: D-P0-005 s2, 05_SECURITY
    implementation: [ngrc/tenancy/views.py, ngrc/tenancy/roles.py, ngrc/tenancy/migrations/0002_security.py]
    tests:
      - {file: tests/test_authorization_api.py, match: [admin_cannot, platform_permissions_can_never, nobody_can_modify_their_own, system_roles_are_immutable, role_creation_validation, role_permission_reduction, cannot_delete_role, invitation_flow, external_auditor_invitation]}
      - {file: tests/test_rls_tenant_isolation.py, match: [tenant_roles_cannot_carry_platform, system_roles_immutable, last_owner]}
    audit_events: [authz.denied, tenant.role.created, tenant.role.updated, tenant.member.role_changed, tenant.invitation.created]
    evidence: [evidence/junit.xml]
    standards: "OWASP API5 BFLA; ISO 27001:2022 A.5.15, A.5.18, A.8.2; SOC 2 CC6.2, CC6.3"
  - id: F-AUZ-004
    feature: Audit-write failure is fail-closed (C-4)
    requirement: A business change and its audit event commit together or not at all; a denial is never turned into an allow by an audit outage
    source: D-P0-006 s3
    implementation: [ngrc/audit/service.py, ngrc/authz/drf.py]
    tests:
      - {file: tests/test_authorization_api.py, match: [audit_append_fails, denial_stays_a_denial, failed_requests_leave_no_partial_state]}
      - {file: tests/test_audit_integrity.py, match: [denial_event_persists, business_transaction_fails, business_change_and_audit_commit]}
    audit_events: [authz.denied]
    evidence: [evidence/junit.xml]
    standards: "ISO 27001:2022 A.8.15; SOC 2 CC7.2"
  # ------------------------------------------------------------------------------------------------ platform plane
  - id: F-PLT-001
    feature: Customer vs platform identity realms
    requirement: Separate stores, cookies, surfaces and credentials; platform realm WebAuthn-only with user verification, no recovery codes
    source: D-P0-005 s1
    implementation: [ngrc/authn/realms.py, ngrc/control_plane/models.py, ngrc/control_plane/views.py, config/settings/base.py]
    tests:
      - {file: tests/test_authentication.py, match: [forged_or_foreign_session_cookies, platform_credentials_are_rejected, recovery_codes_not_accepted_for_operators]}
      - {file: tests/test_support_access.py, match: [operator_requires_webauthn, operator_password_alone, operator_login, operator_cookie, operator_session, operator_counter, tenant_users_cannot_use_platform, operator_session_never_works]}
      - {file: tests/test_config_security.py, match: [each_process_plane]}
    audit_events: [platform.operator.login.success, platform.operator.login.failure, platform.operator.mfa.verified, platform.operator.webauthn.registered, platform.operator.throttle.triggered]
    evidence: [evidence/junit.xml, evidence/config_snapshot.json]
    standards: "ISO 27001:2022 A.5.15, A.8.2, A.8.5; SOC 2 CC6.1, CC6.2, CC6.6"
    gaps: ["Separate hostname / network restriction (VPN or IP allow-list) is a deployment control: BLOCKED (hosting not selected, O-4)", "Platform-admin recovery process is organisational (O-5)"]
    blocked: ["network-restricted operator hostname"]
  - id: F-PLT-002
    feature: Support access grant (time-bound, ticketed, approved, tenant-consented)
    requirement: No standing access; Platform Security approval bound to the grant (T2), Owner consent, ticket+reason, time-boxed, least-privilege profile, DB-enforced separation of duties
    source: D-P0-005 s3
    implementation: [ngrc/control_plane/views.py, ngrc/control_plane/support.py, ngrc/control_plane/migrations/0002_security.py, ngrc/tenancy/views.py]
    tests:
      - {file: tests/test_support_access.py, match: [support_access_end_to_end, tenant_owner_sees, requester_cannot_approve, only_platform_security, approval_requires, request_needs_ticket, only_support_engineers, request_requires_recent, activation_is_impossible, only_a_tenant_owner, another_tenants_owner, consent_before_approval, tenant_has_no_write_path, state_machine_trigger, expired_grant, tenant_owner_revocation, grant_duration, support_session_cannot]}
      - {file: tests/test_support_grant_db_guard.py}
    audit_events: [support.grant.requested, support.grant.approved, tenant.support.consented, tenant.support.revoked, support.session.started, support.action, support.session.ended, platform.support.requested, platform.support.approved, platform.support.consented, platform.support.activated, platform.support.action, platform.support.ended, platform.operator.stepup.success]
    evidence: [evidence/junit.xml]
    standards: "ISO 27001:2022 A.5.15, A.5.16, A.8.2, A.8.15; SOC 2 CC6.1, CC6.2, CC6.3, CC7.2"
    gaps: ["Restricted-class consent is stored but unexercised (no Restricted-class content endpoints exist)", "write_limited profile has no write operations", "Module scope is stored but not enforced (no modules exist)"]
  - id: F-PLT-003
    feature: Break-glass emergency access
    requirement: Two distinct approvers (Platform Security then Platform Admin), requester separate from approvers, 2 h cap, no tenant consent, flagged and alertable
    source: D-P0-005 s4
    implementation: [ngrc/control_plane/views.py, ngrc/control_plane/migrations/0002_security.py]
    tests:
      - {file: tests/test_support_access.py, match: [break_glass, approvers_cannot_request]}
      - {file: tests/test_support_grant_db_guard.py, match: [break_glass_first_approval, requester_who_is_also_security]}
    audit_events: [platform.breakglass.requested, platform.breakglass.approved, support.session.started]
    evidence: [evidence/junit.xml]
    standards: "ISO 27001:2022 A.5.15, A.8.2; SOC 2 CC6.1, CC6.3"
    gaps: ["Immediate e-mail/pager notification to tenant Owners NOT IMPLEMENTED (events appear in the tenant audit stream only)", "Post-incident review record/timer NOT IMPLEMENTED (process control; period is open item O-5)"]
  - id: F-PLT-004
    feature: Platform audit stream access control
    requirement: Platform stream readable only by Platform Security (and the verifier); unreadable by the tenant plane and the operator plane
    source: D-P0-005 s5
    implementation: [ngrc/audit/migrations/0001_audit_schema.py, ngrc/control_plane/views.py]
    tests:
      - {file: tests/test_audit_integrity.py, match: [platform_stream_unreadable, platform_reader_can_read]}
      - {file: tests/test_support_access.py, match: [platform_audit_stream_is_for_platform_security_only]}
    audit_events: [platform.audit.read]
    evidence: [evidence/junit.xml, evidence/privilege_matrix.json]
    standards: "ISO 27001:2022 A.8.15, A.8.17; SOC 2 CC7.2"
  - id: F-PLT-005
    feature: Tenant provisioning by Platform Administrator
    requirement: Only Platform Admin with fresh step-up; Owner invitation token never returned; tenant roles seeded from the catalogue
    source: D-P0-005 s2
    implementation: [ngrc/control_plane/views.py, ngrc/control_plane/migrations/0002_security.py, ngrc/control_plane/migrations/0003_provision_invitation_kind.py]
    tests:
      - {file: tests/test_support_access.py, match: [only_platform_admin_can_provision, provisioning_needs_a_fresh]}
    audit_events: [platform.tenant.provisioned]
    evidence: [evidence/junit.xml]
    standards: "ISO 27001:2022 A.5.18, A.8.2; SOC 2 CC6.2"
    gaps: ["Tenant suspend/offboard lifecycle API NOT IMPLEMENTED (audit action exists; DB column and denial path are tested)"]
  # ------------------------------------------------------------------------------------------------ audit
  - id: F-AUD-001
    feature: Enforced append-only audit tables
    requirement: No runtime or migration identity can INSERT/UPDATE/DELETE/TRUNCATE audit data except via SECURITY DEFINER append functions; triggers block even the schema owner
    source: D-P0-006 s4
    implementation: [ngrc/audit/migrations/0001_audit_schema.py, db/bootstrap/00_roles.sql]
    tests:
      - {file: tests/test_audit_integrity.py, match: [runtime_roles_cannot_mutate, triggers_block, chain_head_may_only, migration_identity, unregistered_action, secret_like_detail_keys, detail_size, writer_role_must_be, app_cannot_write, ops_needs_a_support_grant, action_registry_matches_code]}
      - {file: tests/test_table_classification.py, match: [audit_tables_have_mutation_guards, migration_identity_has_no_privileges]}
      - {file: tests/test_support_grant_db_guard.py, match: [audit_follows_the_real_expiry]}
    audit_events: [audit.integrity_violation]
    evidence: [evidence/junit.xml, evidence/privilege_matrix.json]
    standards: "ISO 27001:2022 A.8.15; SOC 2 CC7.2"
    gaps: ["A database SUPERUSER can still alter audit data; detection (not prevention) relies on external checkpoints - see F-AUD-002"]
  - id: F-AUD-002
    feature: Hash chain with signed, externally exported checkpoints
    requirement: Per-stream SHA-256 chain, independent verification, signed checkpoints, tamper/delete/reorder/truncate/rewrite detection
    source: D-P0-006 s5
    implementation: [ngrc/audit/chain.py, ngrc/audit/sealer.py, ngrc/audit/signer.py, ngrc/audit/verifier.py]
    tests:
      - {file: tests/test_audit_integrity.py, match: [append_chains, tampered, deleted, reordered, truncated, signed_checkpoint, full_chain_recompute, forged_checkpoint, checkpoint_by_unknown_key, sealer_checkpoints]}
      - {file: tests/test_evidence_artifacts.py, match: [audit_chain_verification]}
      - {file: tests/test_audit_completeness.py}
    audit_events: [audit.integrity_violation]
    evidence: [evidence/junit.xml, evidence/audit_chain_verification.json, evidence/h11_mutation_check.txt]
    standards: "ISO 27001:2022 A.8.15; SOC 2 CC7.2"
    dev_only: true
    gaps: ["H-11 (D-P1-003): checkpoints are chained, heartbeat-sealed and verified against anchors, but COMPLETENESS cannot exceed 'consistent' until an immutable sink exists - every anchor is currently rewritable by a schema-owner attacker; events after the newest honest checkpoint are covered by chain consistency only", "Signing key is a DEV-ONLY file on the database host: NOT a production control", "Checkpoint export sink is a local directory, NOT WORM/immutable storage (see F-AUD-006)", "Production KMS signer is NOT IMPLEMENTED (F-DAT-006, open item O-4)", "Cryptographic construction has NOT had an independent review: BLOCKED, no reviewer (F-GOV-004)"]
  - id: F-AUD-003
    feature: Audit verification library (on demand; independent recomputation)
    requirement: Independent recomputation of chains and checkpoints, violation recorded and written to the platform stream
    source: D-P0-006 s6
    implementation: [ngrc/audit/verifier.py]
    tests:
      - {file: tests/test_audit_integrity.py, match: [integrity_violation_is_recorded]}
    audit_events: [audit.integrity_violation]
    evidence: [evidence/junit.xml]
    standards: "ISO 27001:2022 A.8.15, A.8.16; SOC 2 CC7.2, CC7.3"
    gaps: ["The scheduled job, watchdog and incremental mode are the separate control F-AUD-007", "Completeness against anchors is covered by F-AUD-002 (D-P1-003)"]
  - id: F-AUD-007
    phase2_required: true
    feature: Scheduled continuous audit verification with alerting and watchdog
    requirement: Verification job under the verifier identity runs on a schedule and incrementally; a violation raises an alert; an overdue run is itself an alert; production requires the external copy and an independent anchor
    source: D-P0-006 s6, D-P1-003
    implementation: [ngrc/audit/scheduler.py, ngrc/audit/alerts.py, ngrc/audit/management/commands/audit_verify.py, ngrc/audit/management/commands/audit_seal.py, config/settings/base.py, config/settings/prod.py]
    tests:
      - {file: tests/test_scheduled_verification.py}
    audit_events: [audit.verification.completed, audit.verification.overdue, audit.integrity_violation]
    evidence: [evidence/junit.xml, evidence/h11_mutation_check.txt]
    standards: "ISO 27001:2022 A.8.15, A.8.16; SOC 2 CC7.2, CC7.3"
    gaps: ["Alert DELIVERY (pager/SIEM/e-mail) is NOT IMPLEMENTED: alerts reach the log pipeline only (O-4)", "The scheduler is a command / worker loop; WHERE it runs (cron, CronJob, a separate host for the watchdog) is a deployment decision (O-4)", "Incremental runs do not recompute already-verified events; a periodic FULL run is required (tested, documented)", "Thresholds are BASELINE pending approval", "Not independently reviewed (F-GOV-004 BLOCKED)"]
    blocked: ["alert delivery to a real channel"]
  - id: F-AUD-006
    feature: Immutable (WORM) audit checkpoint storage and external anchoring
    requirement: Signed checkpoints published to write-once storage in a separate failure domain; completeness can only be 'established' against such a sink
    source: D-P0-006 s5, D-P1-003
    implementation: []
    tests: []
    pending_specs:
      - {file: tests/test_pending_controls.py, match: [test_worm_sink, test_sink_uses_credentials, test_sealer_does_not_report, test_verifier_compares_database, test_gap_demo_the_dev_export]}
    not_implemented: true
    gaps: ["Hosting/KMS/WORM provider not selected (open item O-4); retention lock periods depend on O-2", "The verifier's two-way external-copy comparison and the `AUDIT_SINK_IMMUTABLE` gate EXIST (F-AUD-002) but the sink itself is a rewritable dev file: completeness cannot exceed 'consistent' until a WORM sink exists", "A gap demo runs today and is expected to fail its assertion (XFAIL): the dev export file is rewritable by the application process"]
    blocked: ["WORM semantics, account separation and retention lock need the real provider"]
    production_gate: true
  - id: F-AUD-004
    feature: Audit retention and purge procedure
    requirement: Retention periods, legal hold, purge only with export/anchor/second approval
    source: D-P0-006 s8
    implementation: []
    tests: []
    not_implemented: true
    gaps: ["Retention periods are open item O-2 (no values invented); purge procedure is Phase 2"]
  - id: F-AUD-005
    feature: Audit read and export controls
    requirement: Tenant audit read/export needs permission (+ step-up for export), is tenant-scoped, and is itself audited
    source: D-P0-006 s7
    implementation: [ngrc/tenancy/views.py]
    tests:
      - {file: tests/test_authorization_api.py, match: [audit_trail_and_export, member_has_no_tenant_admin]}
      - {file: tests/test_support_access.py, match: [tenant_owner_sees]}
    audit_events: [audit.read, audit.export]
    evidence: [evidence/junit.xml]
    standards: "ISO 27001:2022 A.8.15; SOC 2 CC7.2"
  # ------------------------------------------------------------------------------------------------ data protection
  - id: F-DAT-001
    feature: Data classification and handling rules
    requirement: Levels P/I/C/R assigned to every table; Restricted data never in logs, audit details, API responses or caches
    source: D-P0-007
    implementation: [db/table_classification.yaml, ngrc/core/logging.py, ngrc/audit/actions.py]
    tests:
      - {file: tests/test_table_classification.py, match: [manifest_entries_are_well_formed, manifest_equals_catalogue]}
      - {file: tests/test_input_and_exposure.py, match: [no_secret_ever_reaches_the_audit_trail, secrets_are_not_logged, redaction_filter, api_responses_never_contain, totp_secret_is_shown_exactly_once, emails_carry_tokens]}
    audit_events: []
    evidence: [evidence/junit.xml]
    standards: "ISO 27001:2022 A.5.12, A.5.13, A.8.11; SOC 2 C1.1"
    gaps: ["Handling rules for Confidential tenant content (export, retention, AI use) have no content to apply to yet (Phase 2+)"]
  - id: F-DAT-002
    feature: Envelope AEAD encryption for reversible secrets
    requirement: AES-256-GCM, per-record data key, AAD bound to tenant/record/field; KMS-held master key in production
    source: D-P0-007 s3
    implementation: [ngrc/core/crypto.py]
    tests:
      - {file: tests/test_crypto.py}
      - {file: tests/test_authentication.py, match: [totp_secret_is_stored_encrypted]}
    audit_events: []
    evidence: [evidence/junit.xml]
    standards: "ISO 27001:2022 A.8.24; SOC 2 CC6.1, CC6.7"
    dev_only: true
    gaps: ["Master key comes from the environment (DEV-ONLY local provider); KMS/HSM provider and key rotation are NOT IMPLEMENTED (F-DAT-006, open item O-4)", "Cryptographic review NOT done: BLOCKED, no independent reviewer (F-GOV-004)"]
  - id: F-DAT-003
    feature: Hash-only storage of tokens and recovery codes
    requirement: Session ids, reset/verify/invite tokens stored as SHA-256; recovery codes as keyed HMAC; raw values shown once
    source: D-P0-007 s3
    implementation: [ngrc/core/crypto.py, ngrc/authn/sessions.py, ngrc/authn/recovery.py, ngrc/iam/services.py]
    tests:
      - {file: tests/test_authentication.py, match: [only_a_hash_of_the_session_id, recovery_codes_are_stored_hashed, reset_token_is_stored_hashed]}
      - {file: tests/test_crypto.py, match: [tokens_are_high_entropy, keyed_hashes]}
    audit_events: []
    evidence: [evidence/junit.xml]
    standards: "ISO 27001:2022 A.8.24, A.5.17; OWASP ASVS V2, V3"
    gaps: ["The recovery-code pepper is an environment value (production: KMS-held, O-4)"]
  - id: F-DAT-004
    phase2_required: true
    feature: Authorization-checked evidence download (C-6)
    requirement: Application-streamed, authorization-checked evidence downloads; no signed storage URLs; audited before release; integrity-verified; clean-scan gate
    source: D-P0-007 s5, D-P1-002
    implementation: [ngrc/evidence/views.py, ngrc/evidence/storage.py, ngrc/evidence/models.py, ngrc/evidence/migrations/0002_security.py]
    tests:
      - {file: tests/test_evidence_download.py}
    audit_events: [evidence.downloaded, evidence.hash_mismatch, authz.denied]
    evidence: [evidence/junit.xml, evidence/p2_evidence_mutation_check.txt]
